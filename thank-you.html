<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're in — Vexora</title>
    <meta name="description" content="Thanks for backing Vexora early.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B0D12'/%3E%3Cpath d='M8 9l8 14 8-14' stroke='%232FAE7A' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
    <style>
        :root {
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --color-green: #2FAE7A;
            --color-green-hover: #28996c;
            --color-violet: #6D5DFC;
            --color-blue: #4F8EF7;
            --color-orange: #F0975A;
            --space-xs: 4px; --space-sm: 8px; --space-md: 16px; --space-lg: 24px; --space-xl: 32px; --space-2xl: 48px; --space-3xl: 64px;
            --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px; --radius-xl: 16px; --radius-2xl: 20px; --radius-full: 9999px;
            --header-height: 72px; --content-max-width: 1080px; --content-narrow: 800px; --content-narrowest: 680px;
            --transition-fast: 150ms ease; --transition-base: 250ms ease;
        }
        [data-theme="dark"] {
            --bg-primary: #0B0D12; --bg-secondary: #0E1016; --surface: #15171F; --surface-hover: #1A1D26; --surface-border: rgba(255,255,255,0.06);
            --text-primary: #F0F0F0; --text-secondary: rgba(240,240,240,0.75); --text-tertiary: rgba(240,240,240,0.6); --text-muted: rgba(240,240,240,0.5); --text-faint: rgba(240,240,240,0.4);
            --header-bg: rgba(11,13,18,0.7); --header-bg-scrolled: rgba(11,13,18,0.95); --toggle-hover: rgba(255,255,255,0.06); --footer-border: rgba(255,255,255,0.06);
            --btn-primary-bg: var(--color-green); --btn-primary-text: #ffffff; --btn-secondary-border: rgba(255,255,255,0.15); --btn-secondary-text: var(--text-primary);
        }
        [data-theme="light"] {
            --bg-primary: #FAFAF8; --bg-secondary: #F7F7F5; --surface: #FFFFFF; --surface-hover: #F5F5F3; --surface-border: rgba(0,0,0,0.08);
            --text-primary: #1A1A1A; --text-secondary: rgba(26,26,26,0.75); --text-tertiary: rgba(26,26,26,0.6); --text-muted: rgba(26,26,26,0.5); --text-faint: rgba(26,26,26,0.4);
            --header-bg: rgba(250,250,248,0.7); --header-bg-scrolled: rgba(250,250,248,0.95); --toggle-hover: rgba(0,0,0,0.04); --footer-border: rgba(0,0,0,0.08);
            --btn-primary-bg: var(--color-green); --btn-primary-text: #ffffff; --btn-secondary-border: rgba(0,0,0,0.15); --btn-secondary-text: var(--text-primary);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color var(--transition-base), color var(--transition-base);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-height);
            background-color: var(--header-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 100;
            transition: background-color var(--transition-base);
        }

        .header-content {
            max-width: var(--content-max-width);
            margin: 0 auto;
            padding: 0 var(--space-xl);
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .logo svg {
            width: 28px;
            height: 28px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: var(--space-md);
        }

        .theme-toggle {
            background: none;
            border: none;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            transition: background-color var(--transition-fast);
        }

        .theme-toggle:hover {
            background-color: var(--toggle-hover);
        }

        .theme-toggle svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        [data-theme="dark"] .icon-moon { display: none; }
        [data-theme="light"] .icon-sun { display: none; }

        /* Main Content */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 100px var(--space-xl);
            margin-top: var(--header-height);
        }

        .container {
            max-width: 560px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 17px;
            color: var(--text-secondary);
            opacity: 0.75;
            margin-bottom: 32px;
        }

        .updates-block {
            margin-top: 32px;
        }

        .updates-text {
            font-size: 14px;
            color: var(--text-tertiary);
            margin-bottom: 16px;
        }

        .social-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-md);
        }

        .social-link {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            padding: var(--space-sm) var(--space-md);
            background-color: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            transition: background-color var(--transition-fast), border-color var(--transition-fast);
        }

        .social-link:hover {
            background-color: var(--surface-hover);
            border-color: var(--text-muted);
        }

        .social-link svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* Footer */
        footer {
            border-top: 1px solid var(--footer-border);
            padding: var(--space-2xl) var(--space-xl);
            margin-top: auto;
        }

        .footer-content {
            max-width: var(--content-max-width);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: var(--space-xl);
        }

        @media (min-width: 768px) {
            .footer-content {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .footer-brand {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            font-size: 18px;
            font-weight: 700;
        }
        
        .footer-brand svg {
            width: 20px;
            height: 20px;
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-lg);
            align-items: center;
            font-size: 14px;
            color: var(--text-tertiary);
        }

        .footer-links a {
            transition: color var(--transition-fast);
        }

        .footer-links a:hover {
            color: var(--text-primary);
        }

        .copyright {
            color: var(--text-muted);
        }

        /* Follow Popup */
        .follow-container {
            position: relative;
            display: inline-block;
        }

        .follow-trigger {
            background: none;
            border: none;
            color: inherit;
            font: inherit;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: color var(--transition-fast);
        }

        .follow-trigger:hover {
            color: var(--text-primary);
        }

        .follow-trigger svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
            transition: transform var(--transition-fast);
        }

        .follow-container[data-active="true"] .follow-trigger svg {
            transform: rotate(180deg);
        }

        .follow-popup {
            position: absolute;
            bottom: calc(100% + var(--space-sm));
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background-color: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-md);
            padding: var(--space-sm);
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 140px;
            opacity: 0;
            visibility: hidden;
            transition: opacity var(--transition-fast), transform var(--transition-fast), visibility var(--transition-fast);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .follow-container[data-active="true"] .follow-popup {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .follow-popup a {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            padding: var(--space-sm) var(--space-md);
            color: var(--text-primary);
            border-radius: var(--radius-sm);
            transition: background-color var(--transition-fast);
        }

        .follow-popup a:hover {
            background-color: var(--surface-hover);
            color: var(--text-primary);
        }

        .follow-popup svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }
    .header__logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-primary);
    }

    .header__logo-icon-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(47, 174, 122, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(47, 174, 122, 0.18);
      overflow: hidden;
      transition: background var(--transition-base), border-color var(--transition-base), transform var(--transition-base);
    }

    .header__logo:hover .header__logo-icon-wrap {
      background: rgba(47, 174, 122, 0.18);
      border-color: rgba(47, 174, 122, 0.3);
      transform: scale(1.05);
    }

    .header__logo-icon {
      width: 100%;
      height: 100%;
      padding: 4px;
      box-sizing: border-box;
      object-fit: contain;
    }

    .header__logo-text {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      transition: color var(--transition-base);
    }

    [data-theme="light"] .header__logo-icon-wrap {
      background: rgba(47, 174, 122, 0.1);
      border-color: rgba(47, 174, 122, 0.2);
    }
    </style>
    <script>
        // Init theme
        const savedTheme = localStorage.getItem('vexora-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="./index.html" class="header__logo">
                <span class="header__logo-icon-wrap">
                    <img src="logo.png" alt="Vexora V logo" class="header__logo-icon">
                </span>
                <span class="header__logo-text">Vexora</span>
            </a>
            <div class="header-actions">
                <button class="theme-toggle" aria-label="Toggle theme">
                    <svg class="icon-sun" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 18C8.68629 18 6 15.3137 6 12C6 8.68629 8.68629 6 12 6C15.3137 6 18 8.68629 18 12C18 15.3137 15.3137 18 12 18ZM12 16C14.2091 16 16 14.2091 16 12C16 9.79086 14.2091 8 12 8C9.79086 8 8 9.79086 8 12C8 14.2091 9.79086 16 12 16ZM11 1H13V4H11V1ZM11 20H13V23H11V20ZM3.51472 4.92893L4.92893 3.51472L7.05025 5.63604L5.63604 7.05025L3.51472 4.92893ZM16.9497 18.364L18.364 16.9497L20.4853 19.0711L19.0711 20.4853L16.9497 18.364ZM19.0711 3.51472L20.4853 4.92893L18.364 7.05025L16.9497 5.63604L19.0711 3.51472ZM5.63604 16.9497L7.05025 18.364L4.92893 20.4853L3.51472 19.0711L5.63604 16.9497ZM23 11V13H20V11H23ZM4 11V13H1V11H4Z"/>
                    </svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M10 7C10 10.866 13.134 14 17 14C18.9584 14 20.729 13.1957 21.9995 11.8966C22 11.9309 22 11.9652 22 11.9995C22 17.5224 17.5228 21.9995 12 21.9995C6.47715 21.9995 2 17.5224 2 11.9995C2 6.47672 6.47715 1.99951 12 1.99951C12.0343 1.99951 12.0686 1.99951 12.1029 2.00003C10.8038 3.27055 10 5.04108 10 7ZM4 11.9995C4 16.4178 7.58172 19.9995 12 19.9995C15.8166 19.9995 19.0089 17.3243 19.8277 13.7381C18.9765 14.394 17.9056 14.7779 16.75 14.7779C12.0556 14.7779 8.25 10.9723 8.25 6.27795C8.25 5.12239 8.63391 4.05146 9.28975 3.2003C5.70355 4.01912 3.0284 7.21141 3.0284 11.0279L4 11.9995Z"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <h1>You're in.</h1>
            <p class="subtitle">Thanks for backing Vexora early. You'll get an email the moment it's ready — estimated in 12 to 24 weeks. Reply to that email anytime with questions or ideas.</p>
            
            <div class="updates-block">
                <p class="updates-text">Want updates in the meantime?</p>
                <div class="social-links">
                    <a href="https://x.com/noxielabs" class="social-link" target="_blank" rel="noopener">

                        Twitter
                    </a>
                    <a href="https://t.me/noxielabs" class="social-link" target="_blank" rel="noopener">

                        </svg>
                        Telegram
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-brand">
                <img src="./logo.png" alt="Vexora logo" style="width: 28px; height: 28px; object-fit: contain;">
                Vexora
            </div>
            <div class="footer-links">
                <span class="copyright">© 2026 Vexora</span>
                <a href="./privacy.html">Privacy</a>
                <a href="./terms.html">Terms</a>
                <a href="https://tally.so/r/rjQXMv" target="_blank" rel="noopener">Got feedback?</a>
                <div class="follow-container">
                    <button class="follow-trigger">
                        Follow us
                        <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
                    </button>
                    <div class="follow-popup">
                        <a href="https://x.com/noxielabs" target="_blank" rel="noopener">
                            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                            </svg>
                            Twitter
                        </a>
                        <a href="https://t.me/noxielabs" target="_blank" rel="noopener">
                            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.06-.2-.06-.05-.14-.03-.21-.02-.09.02-1.46.93-4.13 2.73-.39.27-.74.4-1.06.39-.35-.01-1.02-.2-1.52-.36-.61-.2-1.09-.31-1.05-.66.02-.18.27-.36.75-.55 2.94-1.28 4.9-2.12 5.88-2.53 2.79-1.16 3.37-1.36 3.75-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .34z"/>

    </footer>

    <script>
        // Theme toggling
        const themeToggle = document.querySelector('.theme-toggle');
        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('vexora-theme', newTheme);
        });

        // Header scroll effect
        const header = document.querySelector('header');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 10) {
                header.style.backgroundColor = 'var(--header-bg-scrolled)';
                header.style.boxShadow = '0 1px 2px var(--surface-border)';
            } else {
                header.style.backgroundColor = 'var(--header-bg)';
                header.style.boxShadow = 'none';
            }
        });

        // Follow popup logic
        const followContainer = document.querySelector('.follow-container');
        const followTrigger = document.querySelector('.follow-trigger');
        
        followTrigger.addEventListener('click', (e) => {
            e.stopPropagation();
            const isActive = followContainer.getAttribute('data-active') === 'true';
            followContainer.setAttribute('data-active', !isActive);
        });

        document.addEventListener('click', (e) => {
            if (!followContainer.contains(e.target)) {
                followContainer.setAttribute('data-active', 'false');
            }
        });
    </script>
</body>
</html>
